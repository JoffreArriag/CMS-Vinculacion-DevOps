name: CMS Vinculacion CI/CD

on:
  push:
    branches: [ "devops-config-ci-cd" ]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0'
      - name: Compilar Backend
        run: dotnet build CMSVinculacion.Api --configuration Release

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar y Compilar Frontend
        run: |
          cd Cms-obstreticia
          npm install
          npm run build

  test-backend:
    needs: build-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0'
      - name: Ejecutar Pruebas xUnit
        # Quitamos --no-build para que el test compile lo necesario en este runner
        run: dotnet test --verbosity normal

  test-frontend:
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Ejecutar Pruebas Angular
        run: |
          cd Cms-obstreticia
          # Usamos una configuración de CI estándar para Angular
          npm test -- --watch=false --browsers=ChromeHeadless --no-progress