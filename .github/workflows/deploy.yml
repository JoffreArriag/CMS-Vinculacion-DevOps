name: CMS Vinculacion CI/CD

on:
  push:
    # Esto hace que el "Robot" se active en estas 3 ramas
    branches: [ "main", "feature/equipo4-backend", "devops-config-ci-cd" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # T-23: Stage Build para .NET (Backend)
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0'

      - name: Restaurar dependencias
        # Busca cualquier archivo .sln y descarga las librerías
        run: dotnet restore $(find . -name "*.sln" | head -n 1)

      - name: Compilar Backend (Stage Build)
        # Compila el proyecto en modo Release (listo para producción)
        run: dotnet build $(find . -name "*.sln" | head -n 1) --configuration Release --no-restore