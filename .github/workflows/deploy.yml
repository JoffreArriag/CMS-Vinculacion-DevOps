build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar y Compilar Frontend
        run: |
          # Buscamos dónde está el package.json de Angular
          FRONT_DIR=$(find . -name "package.json" -not -path "*/node_modules/*" -exec dirname {} \;)
          echo "Carpeta de Frontend encontrada en: $FRONT_DIR"
          cd "$FRONT_DIR"
          npm install
          npm run build