name: CMS Vinculacion CI/CD

on:
  push:
    branches: [ "devops-config-ci-cd" ]

jobs:
  # T-23: Compilación del Backend
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0'

      - name: Compilar Backend
        run: dotnet build CMSVinculacion.Api --configuration Release

  # T-23: Compilación del Frontend (Angular)
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar y Compilar Frontend
        run: |
          cd Cms-obstreticia
          npm install
          npm run build