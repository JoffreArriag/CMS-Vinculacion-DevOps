name: CMS Vinculacion CI/CD

on:
  push:
    branches: [ "main", "feature/equipo4-backend", "devops-config-ci-cd" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0'

      - name: Listar archivos (Para Debug)
        # Esto nos mostrará en el log qué carpetas hay realmente
        run: ls -R

      - name: Restaurar y Compilar
        # Esta versión es más agresiva para encontrar el proyecto
        run: |
          dotnet restore **/*.sln || dotnet restore **/*.csproj
          dotnet build **/*.sln --configuration Release || dotnet build **/*.csproj --configuration Release