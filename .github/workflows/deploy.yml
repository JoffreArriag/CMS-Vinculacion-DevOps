name: CMS Vinculacion CI/CD

on:
  push:
    # Se activa cuando subes código a estas ramas
    branches: [ "main", "feature/equipo4-backend", "devops-config-ci-cd" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # T-23: Stage Build para .NET (Backend)
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0'

      - name: Restaurar dependencias
        # Entra a la carpeta CMSVinculacion.Api para buscar el archivo de solución
        run: dotnet restore CMSVinculacion.Api/CMSVinculacion.Api.sln

      - name: Compilar Backend (Stage Build)
        # Compila el proyecto en modo Release usando la ruta exacta
        run: dotnet build CMSVinculacion.Api/CMSVinculacion.Api.sln --configuration Release --no-restore